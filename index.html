<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MiragedGeist</title>
<meta name="description" content="MiragedGeist — 修图与剪辑作品集 · 个人名片" />
<meta property="og:title" content="MiragedGeist" />
<meta property="og:description" content="修图与剪辑作品集 · 个人名片" />
<meta property="og:type" content="profile" />
<!-- 网站图标 / 添加到主屏幕显示的图标（使用头像） -->
<link rel="icon" type="image/png" sizes="32x32" href="media/icons/favicon-32.png" />
<link rel="apple-touch-icon" href="media/icons/apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<!-- 英文字体：Bodoni Moda（博多尼体） -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap" />
<!-- 中文字体：霞鹜铭心宋（LXGW Heart Serif） -->
<link rel="stylesheet" href="https://fontsapi.zeoseven.com/24/main/result.css" />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<div class="aurora" aria-hidden="true">
  <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  <span class="grain"></span>
</div>

<!-- ============ 首页 ============ -->
<main id="view-home" class="view">

  <!-- Hero -->
  <header class="hero" id="hero">
    <div class="hero-cover" id="heroCover"></div>
    <div class="hero-veil"></div>
    <div class="avatar-wrap">
      <div class="avatar-ring"></div>
      <img class="avatar" id="heroAvatar" alt="头像" />
      <button class="pin-edit avatar-edit" data-edit="avatar" title="更换头像">
        <svg viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path d="M9 3.5 7.8 5.6H5A2 2 0 0 0 3 7.6v9.9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7.6a2 2 0 0 0-2-2h-2.8L15 3.5H9Z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
      </button>
    </div>
    <div class="hero-inner">
      <h1 class="hero-name" id="heroName">MiragedGeist</h1>
      <p class="hero-tagline" id="heroTagline"></p>
      <div class="hero-meta" id="heroMeta"></div>
    </div>
    <button class="pin-edit cover-edit" data-edit="cover" title="更换背景图">
      <svg viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path d="M9 3.5 7.8 5.6H5A2 2 0 0 0 3 7.6v9.9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7.6a2 2 0 0 0-2-2h-2.8L15 3.5H9Z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
      <span>背景</span>
    </button>
  </header>

  <div class="page">

    <!-- 简介 -->
    <section class="sec" id="sec-about">
      <div class="sec-head">
        <h2>关于我</h2>
        <button class="btn-ghost edit-only" data-edit="bio">编辑简介</button>
      </div>
      <div class="card bio" id="bioBox"></div>
    </section>

    <!-- 社交媒体 -->
    <section class="sec" id="sec-social">
      <div class="sec-head">
        <h2>社交媒体</h2>
        <button class="btn-ghost edit-only" data-edit="social-add">+ 粘贴链接添加</button>
      </div>
      <div class="social-grid" id="socialGrid"></div>
    </section>

    <!-- 修图产出 -->
    <section class="sec" id="sec-works">
      <div class="sec-head">
        <h2>修图产出</h2>
        <button class="btn-ghost edit-only" data-edit="work-add">+ 新建专栏</button>
      </div>
      <div class="search-bar">
        <svg class="mag" viewBox="0 0 24 24"><path d="M21 21l-4.3-4.3M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="workSearch" type="search" placeholder="搜索专栏名称…" autocomplete="off" />
      </div>
      <div class="collections" id="workCollections"></div>
      <div class="pager" id="workPager" hidden></div>
    </section>

    <!-- 影视Cut -->
    <section class="sec" id="sec-films">
      <div class="sec-head">
        <h2>影视Cut</h2>
        <a class="col-more" href="#/films" title="查看全部">查看全部 →</a>
        <button class="btn-ghost edit-only" data-edit="film-add">+ 添加影视</button>
      </div>
      <div class="film-grid" id="filmHome"></div>
    </section>

    <footer class="foot">
      <div class="foot-mark" id="footMark">MiragedGeist</div>
      <div class="foot-sub">© <span id="year"></span> · 保留所有作品版权</div>
      <button class="foot-key" id="adminKey" title="管理入口">◆</button>
    </footer>
  </div>
</main>

<!-- ============ 专栏详情 ============ -->
<main id="view-detail" class="view" hidden>
  <div class="page detail-page">
    <button class="back-btn" id="backBtn">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      返回
    </button>
    <div class="detail-head">
      <div class="detail-title-row">
        <h1 id="detailTitle"></h1>
      </div>
      <p id="detailDesc"></p>
      <div class="detail-tools edit-only">
        <button class="btn-solid" id="detailUpload">+ 上传到此专栏</button>
        <button class="btn-ghost" id="detailAddUrl">🌐 粘贴外链图片</button>
        <button class="btn-ghost" id="detailEdit">编辑专栏信息</button>
        <button class="btn-ghost danger" id="detailDelete">删除专栏</button>
      </div>
    </div>
    <div class="masonry" id="detailGrid"></div>
    <div class="pager" id="detailPager" hidden></div>
    <div class="empty" id="detailEmpty" hidden>这个专栏还没有作品</div>
  </div>
</main>

<!-- ============ 影视Cut 列表 ============ -->
<main id="view-films" class="view" hidden>
  <div class="page detail-page">
    <button class="back-btn" id="filmsBackBtn">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      返回
    </button>
    <div class="detail-head">
      <div class="detail-title-row">
        <h1>影视Cut</h1>
      </div>
      <div class="detail-tools edit-only">
        <button class="btn-solid" id="filmAddBtn">+ 添加影视</button>
      </div>
    </div>
    <div class="search-bar">
      <svg class="mag" viewBox="0 0 24 24"><path d="M21 21l-4.3-4.3M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="filmSearch" type="search" placeholder="搜索影视名…" autocomplete="off" />
    </div>
    <div class="film-grid" id="filmList"></div>
    <div class="pager" id="filmPager" hidden></div>
    <div class="empty" id="filmEmpty" hidden>还没有影视资料</div>
  </div>
</main>

<!-- ============ 灯箱 ============ -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lbClose">✕</button>
  <button class="lb-nav prev" id="lbPrev">‹</button>
  <button class="lb-nav next" id="lbNext">›</button>
  <div class="lb-stage" id="lbStage"></div>
  <div class="lb-cap" id="lbCap"></div>
</div>

<!-- ============ 影视信息弹层 ============ -->
<div class="filmbox" id="filmbox" hidden>
  <button class="lb-close" id="filmboxClose">✕</button>
  <div class="filmbox-panel">
    <img class="filmbox-img" id="filmboxImg" alt="" />
    <div class="filmbox-main">
      <h3 id="filmboxTitle"></h3>
      <div class="filmbox-desc" id="filmboxDesc"></div>
      <div class="filmbox-links" id="filmboxLinks"></div>
    </div>
  </div>
</div>

<!-- ============ 管理抽屉 ============ -->
<aside class="drawer" id="drawer" hidden>
  <div class="drawer-mask" data-close-drawer></div>
  <div class="drawer-panel">
    <div class="drawer-head">
      <h3 id="drawerTitle">管理面板</h3>
      <button class="icon-btn" data-close-drawer>✕</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </div>
</aside>

<div class="toast-wrap" id="toastWrap"></div>
<div class="busy" id="busy" hidden><div class="busy-box"><div class="spinner"></div><span id="busyText">处理中…</span></div></div>

<input type="file" id="filePicker" hidden />

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
