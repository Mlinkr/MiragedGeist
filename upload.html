<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>原图批量上传 · 生成外链</title>
<style>
  :root{
    --bg:#15111f; --card:#1d1830; --line:#2c2542; --text:#ece8f5; --text2:#a89fc4;
    --accent:#7aa2ff; --ok:#5fd08a; --warn:#f0b35a; --danger:#ff6b81;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px}
  header h1{font-size:21px;margin:6px 0 4px}
  header .sub{color:var(--text2);font-size:13px;margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  .lbl{display:block;font-size:13px;color:var(--text2);margin:10px 0 6px}
  .lbl:first-child{margin-top:0}
  input[type=text],textarea{width:100%;background:#120e1c;border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit}
  textarea{resize:vertical}
  .row{display:flex;gap:8px}
  .row input{flex:1}
  .btn{border:1px solid var(--line);background:#271f3d;color:var(--text);border-radius:10px;
    padding:10px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
  .btn:active{transform:translateY(1px)}
  .btn.solid{background:var(--accent);color:#0d0a16;border-color:var(--accent);font-weight:600;flex:1}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .state{font-size:13px;margin-top:8px}
  .state.ok{color:var(--ok)} .state.warn{color:var(--warn)}
  .drop{border:2px dashed var(--line);border-radius:14px;padding:26px 16px;text-align:center;color:var(--text2)}
  .drop.drag{border-color:var(--accent);color:var(--text);background:#211a36}
  .drop p{margin:0 0 10px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;gap:10px;align-items:flex-start}
  .item .thumb{width:60px;height:60px;object-fit:cover;border-radius:8px;flex:none;background:#120e1c}
  .item .meta{flex:1;min-width:0}
  .item .name{font-size:13px;word-break:break-all}
  .item .size{font-size:12px;color:var(--text2)}
  .item .prog{font-size:12px;color:var(--accent);margin-top:2px}
  .item .integ{font-size:12px;margin-top:2px;word-break:break-all}
  .item .integ.ok{color:var(--ok)}
  .item .integ.warn{color:var(--warn)}
  .item .integ.bad{color:var(--danger);font-weight:600}
  .item .links{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .item .link{font-size:12px;padding:7px 9px}
  .item .ops{display:flex;flex-direction:column;gap:6px;flex:none}
  .mini{border:1px solid var(--line);background:#271f3d;color:var(--text2);border-radius:8px;
    padding:6px 9px;font-size:12px;cursor:pointer}
  .mini:active{transform:translateY(1px)}
  .tip{font-size:12px;color:var(--text2);margin-top:8px;line-height:1.5}
  #toastWrap{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
    display:flex;flex-direction:column;gap:8px;z-index:9999;width:max-content;max-width:90vw}
  .toast{background:#000a;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;
    border:1px solid #ffffff22;animation:tin .2s ease}
  .toast.ok{border-color:#5fd08a88} .toast.err{border-color:#ff6b8188}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>原图批量上传</h1>
    <p class="sub">批量上传到 COS，自动生成「原图外链」+「缩略图外链」。复制后粘到专栏管理面板的「🌐 粘贴外链图片」即可（每行格式：<code>原图 | 标题 | 缩略图</code>）。原图为字节级直传、不做任何压缩；<b>每张上传后会自动把桶内文件读回，与本地原文件比对 SHA256</b>，显示「✅ 字节一致」才算真正原图。</p>
  </header>

  <section class="card">
    <label class="lbl">COS 中转地址（云函数 URL）</label>
    <div class="row">
      <input id="relay" type="text" placeholder="https://xxx.apigw.tencentcs.com/... 或 scf 函数URL" inputmode="url">
      <button id="saveRelay" class="btn">保存</button>
    </div>
    <div id="relayState" class="state"></div>
    <div class="row" style="margin-top:8px">
      <button id="diag" class="btn ghost" style="flex:1">🔍 诊断连通性</button>
    </div>
    <div id="diagOut" class="tip" style="display:none"></div>

    <label class="lbl">目标文件夹（可选，默认 uploads；会作为 COS 路径 Photos/文件夹/…）</label>
    <input id="folder" type="text" placeholder="例如：赵今麦专栏 / 2026旅拍">
  </section>

  <section class="card">
    <div id="drop" class="drop">
      <p>把图片拖到这里，或</p>
      <button id="pick" class="btn">选择图片（可多选）</button>
      <input id="file" type="file" accept="image/*" multiple hidden>
    </div>
  </section>

  <section class="card actions">
    <button id="upload" class="btn solid">开始上传</button>
    <button id="copyAll" class="btn">复制全部外链</button>
    <button id="clear" class="btn ghost">清空</button>
  </section>

  <section id="list" class="list"></section>

  <section class="card">
    <label class="lbl">全部外链（可直接整段复制，粘到专栏「🌐 粘贴外链图片」）</label>
    <textarea id="allLinks" rows="8" readonly placeholder="上传完成后这里会生成每行一条：原图外链 | 标题 | 缩略图外链"></textarea>
    <div class="tip">格式与专栏「粘贴外链图片」完全兼容：<code>原图URL | 标题 | 缩略图URL</code>。缩略图留空时专栏会自动用原图。</div>
  </section>
</main>
<div id="toastWrap"></div>

<script type="module">
import { cosReady, cosRelay, cosDiagnose } from './assets/js/cos.js';
import { el, uid, toast } from './assets/js/ui.js';

const $ = s => document.querySelector(s);
const LS_RELAY = 'mg_cos_sync_url';

/* ---------- COS 中转地址（与管理面板共用 localStorage，配过一次即可） ---------- */
const relayIn = $('#relay');
relayIn.value = localStorage.getItem(LS_RELAY) || '';
function refreshRelayState() {
  const ok = cosReady();
  const s = $('#relayState');
  s.textContent = ok ? '✅ 已配置，可直接上传' : '⚠️ 未配置，请填写并保存云函数 URL';
  s.className = 'state ' + (ok ? 'ok' : 'warn');
  $('#upload').disabled = !ok;
}
$('#saveRelay').onclick = () => {
  const v = relayIn.value.trim();
  if (v) localStorage.setItem(LS_RELAY, v); else localStorage.removeItem(LS_RELAY);
  toast(v ? '已保存中转地址' : '已清除', v ? 'ok' : '');
  refreshRelayState();
};
$('#diag').onclick = async () => {
  const out = $('#diagOut');
  out.style.display = 'block';
  out.textContent = '⏳ 正在诊断…';
  try {
    const r = await cosDiagnose();
    out.innerHTML = r.map(x => `· ${x.ok ? '✅' : '❌'} ${x.step}: ${x.msg}`).join('<br>');
  } catch (e) { out.textContent = '❌ 诊断异常: ' + e.message; }
};
refreshRelayState();

/* ---------- 缩略图：本地 700px / 0.8（与管理面板一致）；原图则原字节直传 ---------- */
function compressImage(file, maxSide = 700, quality = .8) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, w, h);
      cv.toBlob(b => b ? resolve(b) : reject(new Error('缩略图生成失败')), 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('无法读取图片')); };
    img.src = url;
  });
}
const cleanName = n => (n || '').replace(/\.[^.]+$/, '');
const fmtSize = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB';

/* ---------- 字节级自检：上传后把桶内文件读回，与本地原文件比对 SHA256 ---------- */
async function sha256Hex(input) {
  const buf = input instanceof ArrayBuffer ? input : await input.arrayBuffer();
  const h = await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function verifyIntegrity(it, remoteUrl) {
  try {
    const [local, remote] = await Promise.all([
      sha256Hex(it.file),
      sha256Hex(await (await fetch(remoteUrl, { cache: 'no-store' })).blob()),
    ]);
    return local === remote
      ? { ok: true, hash: local }
      : { ok: false, local, remote };
  } catch (e) {
    return { ok: null, err: e.message };
  }
}

/* ---------- 选择 / 拖拽 ---------- */
let items = [];
const fileIn = $('#file');
$('#pick').onclick = () => fileIn.click();
fileIn.onchange = () => { if (fileIn.files.length) addFiles([...fileIn.files]); fileIn.value = ''; };
const drop = $('#drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));
drop.addEventListener('drop', e => { if (e.dataTransfer.files.length) addFiles([...e.dataTransfer.files]); });

function addFiles(files) {
  for (const f of files) {
    if (!f.type.startsWith('image/')) { toast(`${f.name} 不是图片，已跳过`, 'err'); continue; }
    const it = { id: uid(), file: f, status: 'pending', progress: 0, result: null, thumbFallback: false };
    items.push(it);
    renderItem(it);
  }
  refreshAllLinks();
}

function renderItem(it) {
  const node = el('div', { class: 'item' },
    el('img', { class: 'thumb', src: URL.createObjectURL(it.file), alt: '' }),
    el('div', { class: 'meta' },
      el('div', { class: 'name' }, it.file.name),
      el('div', { class: 'size' }, fmtSize(it.file.size)),
      el('div', { class: 'prog' }, '待上传'),
      el('div', { class: 'integ' }, ''),
      el('div', { class: 'links' },
        el('input', { class: 'link', readonly: '', placeholder: '原图外链生成后显示' }),
        el('input', { class: 'link', readonly: '', placeholder: '缩略图外链生成后显示' }),
      ),
      el('div', { class: 'ops' },
        el('button', { class: 'mini', onclick: () => copyText(it._orig.value) }, '复制原图'),
        el('button', { class: 'mini', onclick: () => copyText(it._thumb.value) }, '复制缩略图'),
      ),
    ),
  );
  it._node = node;
  it._prog = node.querySelector('.prog');
  it._integ = node.querySelector('.integ');
  it._orig = node.querySelectorAll('.link')[0];
  it._thumb = node.querySelectorAll('.link')[1];
  $('#list').append(node);
}

function setProgress(it, p) {
  it.progress = p;
  if (it._prog) it._prog.textContent = '上传中 ' + Math.round(p * 100) + '%';
}

/* ---------- 上传单张：原图(原始字节) + 缩略图(700px) ---------- */
async function uploadItem(it) {
  const name = uid();
  const ext = (it.file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
  const ctype = it.file.type || 'image/jpeg';
  const folder = ($('#folder').value.trim() || 'uploads').replace(/[^\w一-龥\-]/g, '-') || 'uploads';

  it.status = 'uploading';
  it._prog.textContent = '上传原图中…';
  // 原图：原始文件字节级直传，零压缩
  const r1 = await cosRelay(`Photos/${folder}/${name}.${ext}`, it.file, ctype, p => setProgress(it, p * 0.6));

  // 字节级自检：把桶内文件读回，与本地原文件比对 SHA256
  it._prog.textContent = '校验原图字节…';
  const v = await verifyIntegrity(it, r1.url);
  if (v.ok === true) {
    it._integ.textContent = '✅ 字节一致（SHA256 匹配，原图零压缩）';
    it._integ.className = 'integ ok';
  } else if (v.ok === null) {
    it._integ.textContent = '⚠️ 无法校验（' + (v.err || '网络/跨域') + '），但上传已成功';
    it._integ.className = 'integ warn';
  } else {
    it._integ.textContent = '❌ 字节不一致！本地 ' + (v.local || '').slice(0, 10) + ' / 远端 ' + (v.remote || '').slice(0, 10);
    it._integ.className = 'integ bad';
  }

  it._prog.textContent = '上传缩略图中…';
  let thumbUrl;
  try {
    const tb = await compressImage(it.file, 700, .8);
    const r2 = await cosRelay(`Photos/${folder}/${name}-t.jpg`, tb, 'image/jpeg', p => setProgress(it, 0.6 + p * 0.4));
    thumbUrl = r2.url;
  } catch (e) {
    // HEIC 等浏览器无法用 canvas 解码时，缩略图回退为原图外链（仍可正常显示）
    thumbUrl = r1.url; it.thumbFallback = true;
  }
  it.status = 'done';
  it.result = { orig: r1.url, thumb: thumbUrl, title: cleanName(it.file.name) };
  it._orig.value = r1.url;
  it._thumb.value = thumbUrl;
  it._prog.textContent = it.thumbFallback ? '✅ 完成（缩略图回退为原图）' : '✅ 完成';
  refreshAllLinks();
}

async function startUpload() {
  if (!cosReady()) return toast('请先配置 COS 中转地址', 'err');
  const pending = items.filter(i => i.status === 'pending' || i.status === 'error');
  if (!pending.length) return toast('没有待上传的文件', '');
  const CONC = 3; let cur = 0;
  const worker = async () => {
    while (cur < pending.length) {
      const it = pending[cur++];
      if (it.status === 'done') continue;
      try { await uploadItem(it); }
      catch (e) { it.status = 'error'; if (it._prog) it._prog.textContent = '✗ ' + (e.message || e); }
    }
  };
  await Promise.all(Array.from({ length: Math.min(CONC, pending.length) }, worker));
  const ok = items.filter(i => i.status === 'done').length;
  toast(`上传完成：${ok} 张`, 'ok');
}

function lineFor(it) {
  if (!it.result) return '';
  return `${it.result.orig} | ${it.result.title} | ${it.result.thumb}`;
}
function refreshAllLinks() {
  $('#allLinks').value = items.filter(i => i.result).map(lineFor).filter(Boolean).join('\n');
}

function copyText(t) {
  if (!t) return;
  const done = () => toast('已复制', 'ok');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(done).catch(() => fallbackCopy(t, done));
  } else fallbackCopy(t, done);
}
function fallbackCopy(t, done) {
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.append(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch { toast('复制失败，请手动选择', 'err'); }
  ta.remove();
}

$('#upload').onclick = startUpload;
$('#copyAll').onclick = () => {
  const v = $('#allLinks').value;
  if (!v) return toast('还没有生成的外链', '');
  copyText(v);
};
$('#clear').onclick = () => { items = []; $('#list').innerHTML = ''; $('#allLinks').value = ''; };
</script>
</body>
</html>
